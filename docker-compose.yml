name: opencanva

# `docker compose up -d db` starts only Postgres, for development (`pnpm dev`).
# `docker compose up -d --build` runs the whole app. See README.md.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: opencanva
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opencanva}
      POSTGRES_DB: opencanva
    ports:
      # Published on this machine only, for development and backups.
      - "${DB_BIND:-127.0.0.1:5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencanva -d opencanva"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://opencanva:${POSTGRES_PASSWORD:-opencanva}@db:5432/opencanva
      DATA_DIR: /data
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-}
    ports:
      # Only this machine by default; there is no login, so put a VPN or an authenticating reverse
      # proxy in front before opening it further (APP_BIND=0.0.0.0:3000).
      - "${APP_BIND:-127.0.0.1:3000}:3000"
    volumes:
      - appdata:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/templates').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5

volumes:
  pgdata:
  appdata:
